appId: ${APP_ID}
---
# Return from the isolated synthetic recipient; preserve both owners' data.
- openLink: dutchlearning://settings
- extendedWaitUntil:
    visible:
      id: screen-settings
    timeout: 15000
- scrollUntilVisible:
    element:
      text: Logout
    direction: DOWN
    timeout: 20000
- tapOn: Logout
- tapOn:
    text: Logout
    index: 1
- extendedWaitUntil:
    visible:
      id: email-input
    timeout: 30000
- tapOn:
    id: email-input
- setClipboard: ${D08_PRIMARY_EMAIL}
- pasteText
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: password-input
- inputText: ${D08_PRIMARY_PASSWORD}
- waitForAnimationToEnd:
    timeout: 5000
- setClipboard: ''
- hideKeyboard
- tapOn:
    id: sign-in-button
- extendedWaitUntil:
    visible: D08 Native QA
    timeout: 60000
- assertNotVisible: D08 Isolated Owner
