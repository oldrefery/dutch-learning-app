appId: ${APP_ID}
---
- assertVisible:
    id: modal-close-button
- repeat:
    while:
      notVisible: .*Re-analyze Word.*
    times: 8
    commands:
      - swipe:
          start: 50%, 88%
          end: 50%, 40%
          duration: 600
- tapOn: .*Re-analyze Word.*
- extendedWaitUntil:
    notVisible: .*Analyzing\.\.\..*
    timeout: 30000
- repeat:
    while:
      notVisible: .*${D08_EXPECTED}.*
    times: 8
    commands:
      - swipe:
          start: 50%, 42%
          end: 50%, 85%
          duration: 600
- assertVisible: .*${D08_EXPECTED}.*
