appId: ${APP_ID}
---
- launchApp
- runFlow:
    when:
      visible: Back
    commands:
      - tapOn: Back
- tapOn: Settings
- extendedWaitUntil:
    visible:
      id: screen-settings
    timeout: 15000
- scrollUntilVisible:
    element:
      id: force-sync-button
    direction: DOWN
    timeout: 20000
- tapOn:
    id: force-sync-button
- extendedWaitUntil:
    visible: Up to date
    timeout: 30000
