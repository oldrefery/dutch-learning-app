- pasteText
- setClipboard: ''
- hideKeyboard
- runFlow:
    when:
      visible: 'Preview (words|document)'
    commands:
      - tapOn: 'Preview (words|document)'
- extendedWaitUntil:
    visible: 'd10android.*'
