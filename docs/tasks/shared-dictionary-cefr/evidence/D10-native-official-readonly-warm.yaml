appId: ${APP_ID}
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: D08 Isolated Owner
    timeout: 30000
- openLink: dutchlearning://settings
- extendedWaitUntil:
    visible:
      id: screen-settings
    timeout: 15000
- scrollUntilVisible:
    element:
      text: Read Only
    direction: UP
    timeout: 20000
- scrollUntilVisible:
    element:
      id: force-sync-button
    direction: DOWN
    timeout: 20000
- tapOn:
    id: force-sync-button
- extendedWaitUntil:
    visible: Up to date
    timeout: 45000
- openLink: dutchlearning://starter-pack?packId=d10-synthetic-navigation-20261002&version=1.0.0
- extendedWaitUntil:
    visible: '1 of 3 words selected.*'
    timeout: 30000
- tapOn:
    id: import-target-4f59dcad-07f7-44c9-ac2e-a0ac3b3aaf78
- assertVisible: '.*kompas.*'
