appId: ${APP_ID}
---
# Test: Review flashcard flow (SRS)
# Tests the core spaced repetition system learning experience
#
# What it tests:
# - Navigate to Review tab
# - View flashcard front (Dutch word)
# - Flip card to back (translations/examples)
# - Rate word with SRS buttons
# - Complete review session
# - Verify session completion screen

# Ensure we're on Add Word screen (login if needed)
- runFlow:
    file: flows/ensure-on-screen.yaml
    env:
      screen_id: 'screen-add-word'
      tab_text: 'Add Word'

# First, add a word to ensure we have something to review
- tapOn:
    text: 'Add Word'
- waitForAnimationToEnd
- tapOn:
    id: 'word-input'
- inputText: 'slapen'
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: 'Search'
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
      - tapOn:
          id: 'analyze-button'
- extendedWaitUntil:
    visible: 'to sleep'
    timeout: 15000
- scroll
- tapOn:
    id: 'collection-selector'
- tapOn:
    text: 'My Words'
- tapOn:
    id: 'save-word-button'
- waitForAnimationToEnd

# Navigate to Review tab
- tapOn:
    text: 'Review'
- waitForAnimationToEnd

# Verify review screen loaded
- assertVisible:
    id: 'screen-review'

# Choose Meaning Recall for the first session
- assertVisible:
    id: 'review-mode-selector'
- tapOn:
    id: 'review-mode-meaning-recall'
- tapOn:
    id: 'start-review-button'
- waitForAnimationToEnd

# Cycle through cards until "slapen" appears (handle existing reviews)
- repeat:
    times: 8
    commands:
      - runFlow:
          when:
            visible:
              id: 'change-review-mode-button'
          commands:
            - tapOn:
                text: 'Review Again'
            - waitForAnimationToEnd
      - runFlow:
          when:
            notVisible: 'slapen'
          commands:
            - runFlow:
                when:
                  visible:
                    id: 'reveal-answer-button'
                commands:
                  - tapOn:
                      id: 'reveal-answer-button'
            - tapOn:
                id: 'srs-good-button'
            - waitForAnimationToEnd

# Verify flashcard front shows (Dutch word)
- extendedWaitUntil:
    visible: 'slapen'
    timeout: 8000

# Reveal with the visible control
- tapOn:
    id: 'reveal-answer-button'
- waitForAnimationToEnd

# Verify card back shows (translation and examples)
- assertVisible: 'to sleep'

# Verify SRS buttons are visible
- assertVisible: 'Again'
- assertVisible: 'Hard'
- assertVisible: 'Good'
- assertVisible: 'Easy'

# Rate the word as "Good"
- tapOn:
    id: 'srs-good-button'
- waitForAnimationToEnd

# Wait a moment for animation
- runScript: scripts/wait.js

# Check if there are more cards or session complete
# If session complete, we should see completion message
# If more cards, we should see next card

# Try to verify either:
# - Session completion screen appears, OR
# - Next card appears (if there are more words to review)
- runFlow:
    when:
      visible:
        id: 'change-review-mode-button'
    commands:
      # Session completed - verify completion screen
      - assertVisible: 'Review Again'

- runFlow:
    when:
      notVisible:
        id: 'change-review-mode-button'
    commands:
      # More cards available - verify next card loaded
      # Just check that Review tab is still active
      - assertVisible:
          id: 'screen-review'

# Finish any remaining Meaning Recall cards
- repeat:
    times: 8
    commands:
      - runFlow:
          when:
            notVisible:
              id: 'change-review-mode-button'
          commands:
            - runFlow:
                when:
                  visible:
                    id: 'reveal-answer-button'
                commands:
                  - tapOn:
                      id: 'reveal-answer-button'
            - runFlow:
                when:
                  visible:
                    id: 'srs-good-button'
                commands:
                  - tapOn:
                      id: 'srs-good-button'
- extendedWaitUntil:
    visible:
      id: 'change-review-mode-button'
    timeout: 15000

# Add a fresh due word and complete Dutch Production
- tapOn:
    id: 'change-review-mode-button'
- waitForAnimationToEnd
- runFlow:
    file: flows/add-word-for-review.yaml
    env:
      word_text: 'koken'
      translation_text: 'to cook'
- tapOn:
    text: 'Review'
- tapOn:
    id: 'review-mode-dutch-production'
- tapOn:
    id: 'start-review-button'
- extendedWaitUntil:
    visible:
      id: 'dutch-production-card'
    timeout: 15000
- tapOn:
    id: 'reveal-answer-button'
- assertVisible: 'koken'
- tapOn:
    id: 'srs-good-button'
- extendedWaitUntil:
    visible:
      id: 'change-review-mode-button'
    timeout: 15000

# Add a fresh due word and complete Recognition. Previously reviewed words
# remain available as deterministic distractors.
- tapOn:
    id: 'change-review-mode-button'
- waitForAnimationToEnd
- runFlow:
    file: flows/add-word-for-review.yaml
    env:
      word_text: 'lezen'
      translation_text: 'to read'
- tapOn:
    text: 'Review'
- tapOn:
    id: 'review-mode-recognition'
- tapOn:
    id: 'start-review-button'
- extendedWaitUntil:
    visible:
      id: 'recognition-card'
    timeout: 15000
- tapOn:
    text: 'to read'
- assertVisible:
    id: 'srs-good-button'
- tapOn:
    id: 'srs-good-button'
- extendedWaitUntil:
    visible:
      id: 'change-review-mode-button'
    timeout: 15000

# Cleanup: delete added word and return to Collections
- tapOn:
    text: 'Collections'
- waitForAnimationToEnd
- swipe:
    start: '50%,80%'
    end: '50%,30%'
    duration: 800
- waitForAnimationToEnd
- tapOn:
    text: 'My Words'
- waitForAnimationToEnd
- runFlow:
    file: flows/delete-word-by-swipe.yaml
    env:
      word_text: 'slapen'
- runFlow:
    file: flows/delete-word-by-swipe.yaml
    env:
      word_text: 'koken'
- runFlow:
    file: flows/delete-word-by-swipe.yaml
    env:
      word_text: 'lezen'
- runFlow:
    when:
      visible:
        id: 'modal-close-button'
    commands:
      - tapOn:
          id: 'modal-close-button'
      - waitForAnimationToEnd
- tapOn:
    text: 'Back'
- waitForAnimationToEnd
- assertVisible:
    id: 'screen-collections'
