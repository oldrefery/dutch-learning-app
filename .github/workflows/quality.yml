name: Quality

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: https://woordenaar.app
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.20.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:ci

      - name: Lint web application
        run: npm run web:lint

      - name: Type-check application
        run: npm run typecheck

      - name: Type-check tests
        run: npm run typecheck:test

      - name: Type-check shared domain
        run: npm run typecheck --workspace @woordenaar/domain

      - name: Type-check Supabase contracts
        run: npm run typecheck --workspace @woordenaar/supabase-contracts

      - name: Type-check web application
        run: npm run web:typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Validate Maestro flows
        run: npm run validate:maestro

      - name: Run Jest tests
        run: npm run test:ci

      - name: Run web Jest coverage
        run: npm run web:test:coverage

      - name: Run web mutation tests
        run: npm run web:mutation

      - name: Run Edge Function tests
        run: npm run test:edge

      - name: Build web application
        run: npm run web:build

      - name: Run Expo Doctor
        run: npm run mobile:expo:doctor

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: jest-coverage
          path: |
            apps/mobile/coverage/
            coverage/web/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: web-mutation-report
          path: reports/mutation/
          if-no-files-found: warn
          retention-days: 14
