name: E2E Tests (Lightweight)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-e2e-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.20.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Maestro test files
        run: npm run validate:maestro

      - name: Check testID coverage
        run: |
          echo "Checking components for testID coverage..."
          echo ""
          echo "Components with testID in auth flows:"
          grep -r "testID=" apps/mobile/src/app/\(auth\)/ --include="*.tsx" | grep -o 'testID="[^"]*"' | sort -u || echo "No testIDs found"
